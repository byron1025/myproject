<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人作品集與服務網站 - 首頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 頂部導覽列容器 (裡面留空，由 JS 自動填入 header.html 的內容) -->
  <header id="global-header"></header>

  <main class="content-container">

    <!-- 首頁內容 -->
    <section class="tab-content active">
      <h2>🏠 歡迎來到我的個人網站</h2>
      <p>這裡展示我的各項專業領域，包含文案撰寫、短影音創作、視覺設計與網路行銷企劃。</p>
      <div class="card-grid">
        <a href="copywriting.html" class="info-card-link">
          <div class="info-card">
            <h3>✍️ 文案撰寫</h3>
            <p>品牌故事、產品銷售頁、社群貼文與SEO文章。</p>
          </div>
        </a>
        <a href="video.html" class="info-card-link">
          <div class="info-card">
            <h3>🎬 短影音</h3>
            <p>剪輯、腳本發想與社群短影音企劃。</p>
          </div>
        </a>
        <a href="photoshop.html" class="info-card-link">
          <div class="info-card">
            <h3>🎨 視覺設計 (PS & AI)</h3>
            <p>影像合成、海報設計與品牌向量識別。</p>
          </div>
        </a>
        <a href="marketing.html" class="info-card-link">
          <div class="info-card">
            <h3>📈 網路行銷</h3>
            <p>社群營運、廣告投放與數據分析。</p>
          </div>
        </a>
      </div>
    </section>

  </main>

  <!-- 2. 自動載入 header.html 並處理當前頁面標亮 (active) 的 JS 語法 -->
  <script>
    fetch('header.html')
      .then(response => {
        if (!response.ok) {
          throw new Error('無法載入 header.html');
        }
        return response.text();
      })
      .then(data => {
        // 將 header.html 的內容放入 <header id="global-header">
        document.getElementById('global-header').innerHTML = data;

        // 取得目前的檔名 (例如 index.html, copywriting.html)
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navLinks = document.querySelectorAll('#navbar a');
        
        // 比對網址，自動替當前頁面的連結加上 active 樣式
        navLinks.forEach(link => {
          if (link.getAttribute('href') === currentPage) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      })
      .catch(error => console.error('載入導覽列失敗:', error));
  </script>
  <script src="script.js"></script>
</body>
</html>
