<!-- Sticky Header with Navigation & Hamburger Menu -->
<header class="fixed w-full top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            
            <!-- 1. Logo / 品牌標題 -->
            <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer" onclick="window.scrollTo(0,0)">
                <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-bold text-xl tracking-tight text-gray-900">企劃提案</span>
            </div>

            <!-- 2. 電腦版導覽連結 (md 以上顯示) -->
            <nav class="hidden md:flex space-x-8">
                <a href="#narrative" class="text-gray-600 hover:text-brand-600 font-medium transition-colors">敘事結構</a>
                <a href="#storyboard" class="text-gray-600 hover:text-brand-600 font-medium transition-colors">分鏡腳本</a>
            </nav>

            <!-- 3. 手機版漢堡按鈕 (md 以下顯示) -->
            <div class="md:hidden flex items-center">
                <button id="menu-btn" type="button" class="text-gray-600 hover:text-gray-900 focus:outline-none p-2" aria-label="Toggle Menu">
                    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
            
        </div>
    </div>

    <!-- 4. 手機版下拉選單區塊 -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-2">
        <a href="#narrative" class="mobile-link block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-gray-50">敘事結構</a>
        <a href="#storyboard" class="mobile-link block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-gray-50">分鏡腳本</a>
    </div>

    <!-- 5. 漢堡選單互動 JavaScript -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        // 點擊漢堡按鈕切換選單顯隱
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // 點擊選單項目後自動收起選單
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
    </script>
</header>
